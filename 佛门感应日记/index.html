    <h1>念六字大明咒感觉内心被净化，心开始向观音变化</h1>
    <h1>感受到观音菩萨像我灌输她的能力试炼我（极度高能的雌雄同体的能力）我受不了</h1>
    <h1>感受到晚上观音菩萨向我反复强调一切唯心识，诸法唯心造。</h1>
    <h1>感受到晚上观音菩萨给我慈海心试炼，但是后面又生气（恨铁不成钢）说了一句：这点小事都做不好</h1>
    <h2>个人思考</h2>
    <p>观音菩萨和我之间存在某种缘分？</p>
